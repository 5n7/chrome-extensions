<svg xmlns="http://www.w3.org/2000/svg" width="260" height="170" viewBox="0 0 260 170">
  <!-- README card art: a Title Rule tag and a Channel Rule tag hang on a string, and the matching one sets the player's speed sticker. -->
  <defs>
    <filter id="wobble" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
    </filter>
  </defs>
  <path d="M8 22C80 34 180 34 252 18" fill="none" stroke="#18181b" stroke-width="3" stroke-linecap="round" filter="url(#wobble)"/>
  <path d="M66 31V44M190 30V42" stroke="#18181b" stroke-width="2.5" stroke-linecap="round"/>
  <g font-family="Kalam, 'Comic Sans MS', cursive" font-weight="700" font-size="16" text-anchor="middle">
    <g transform="rotate(-5 68 61)">
      <rect x="8" y="44" width="120" height="34" rx="8" fill="#ffe0e7" stroke="#18181b" stroke-width="3" filter="url(#wobble)"/>
      <text x="68" y="67" fill="#18181b">ASMR → 1.0x</text>
    </g>
    <g transform="rotate(4 191 59)">
      <rect x="132" y="42" width="118" height="34" rx="8" fill="#ff0033" stroke="#18181b" stroke-width="3" filter="url(#wobble)"/>
      <text x="191" y="65" fill="#fff">@lisp → 2.0x</text>
    </g>
    <rect x="38" y="100" width="184" height="62" rx="12" fill="#1f1f23" stroke="#18181b" stroke-width="3" filter="url(#wobble)"/>
    <path d="M58 119V143L77 131Z" fill="#efeff1" stroke="#efeff1" stroke-width="2" stroke-linejoin="round"/>
    <path d="M92 147H206" stroke="#efeff1" stroke-width="3" stroke-linecap="round" opacity=".35"/>
    <path d="M92 147H142" stroke="#efeff1" stroke-width="3" stroke-linecap="round"/>
    <g transform="rotate(-4 184 121)">
      <rect x="158" y="108" width="52" height="26" rx="6" fill="#fffdf5" stroke="#18181b" stroke-width="2.5" filter="url(#wobble)"/>
      <text x="184" y="127" fill="#18181b">2.0x</text>
    </g>
  </g>
  <path d="M206 82C212 92 208 100 196 105" fill="none" stroke="#18181b" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 6"/>
  <path d="M194 98L195 106L203 106" fill="none" stroke="#18181b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
